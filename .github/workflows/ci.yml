name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # the minimum package.json's engines field promises
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test # builds, then runs the smoke tests against the built worker
